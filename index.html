<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Table and Forms</title>
  </head>
  <body>
    <header>
      <h1>Table and Forms</h1>
    </header>
    <table>
      <caption>
        Intelprocessorer
      </caption>
      <thead>
        <tr>
          <th>Namn</th>
          <th>År</th>
          <th>Klockfrekvens</th>
          <th>Antal-transistorer</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Intel-8088</td>
          <td>1979</td>
          <td>4,77-MHz</td>
          <td>29,000</td>
        </tr>
        <tr>
          <td>Intel-80386DX</td>
          <td>1985</td>
          <td>16-MHz</td>
          <td>275,000</td>
        </tr>
        <tr>
          <td>Pentium</td>
          <td>1993</td>
          <td>60-MHz</td>
          <td>3,100,000</td>
        </tr>
        <tr>
          <td>Core-i7</td>
          <td>2008</td>
          <td>3,33-GHz</td>
          <td>781,000,000</td>
        </tr>
      </tbody>
    </table>
    <form action="tack.html" method="get">
      <h2>Add Processor</h2>
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" /><br /><br />
      <label for="year">År:</label>
      <input
        type="number"
        min="1900"
        max="2026"
        id="year"
        name="year"
      /><br /><br />
      <label for="frequency">Klockfrekvens:</label>
      <input type="number" step="0.01" id="frequency" name="frequency" />
      <label for="frequency">MHz</label>
      <br /><br />
      <label for="transistors">Antal-transistorer:</label>
      <input type="number" id="transistors" name="transistors" /><br /><br />
      <label for="platform">Plattform:</label>
      <input type="radio" id="platform" name="platform" value="Intel" />
      <label for="platform">Intel</label>
      <input type="radio" id="platform" name="platform" value="Apple" />
      <label for="platform">Apple</label>
      <input type="radio" id="platform" name="platform" value="AMD" />
      <label for="platform">AMD</label><br /><br />
      <label for="boost">Boost:</label>
      <input type="checkbox" id="boost" name="boost" value="yes" />
      <label for="hyperThreading">Hyper-Threading:</label>
      <input
        type="checkbox"
        id="hyperThreading"
        name="hyperThreading"
        value="yes"
      /><br /><br />
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
